name: MIMO AI Android

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install Android native build tools
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Prepare pinned llama.cpp Android runtime
        run: bash libs/llama.kt/scripts/bootstrap.sh
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --max-workers 2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIMO-AI-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
